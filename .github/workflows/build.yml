name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifications statiques
        run: python tools/check_resources.py

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Composants SDK necessaires
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Le client web est partage avec le serveur PC : on verifie qu'il a bien
      # ete embarque, sinon l'app servirait une page vide sans rien signaler.
      - name: Le client web est-il present ?
        run: test -f web/index.html && echo "client web trouve"

      - name: Build de l'APK debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verifier que le client web est dans l'APK
        working-directory: android
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html" && echo "index.html embarque"

      - name: Publication de l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NetRemote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publication de l'APK (release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: >
          gh release create "$TAG"
          android/app/build/outputs/apk/debug/app-debug.apk
          --title "NetRemote $TAG"
          --notes "APK debug construit automatiquement depuis le commit $SHA."
