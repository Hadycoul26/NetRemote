<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NetRemote</title>
<style>
  :root {
    --fond: #0d1117;
    --carte: #161b22;
    --trait: #30363d;
    --texte: #e6edf3;
    --doux: #9198a1;
    --vif: #58a6ff;
    --ok: #3fb950;
    --ko: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: var(--fond); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  #etat { font-size: 12px; color: var(--doux); text-align: center; min-height: 16px; }
  #etat.erreur { color: var(--ko); }

  /* L'ecran garde ses proportions : viser juste suppose que ce qu'on voit
     est a l'echelle de ce qu'on touche. */
  #cadre {
    position: relative;
    border: 1px solid var(--trait); border-radius: 10px; overflow: hidden;
    background: #000; line-height: 0;
    max-width: 100%;
  }
  #ecran { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  #vise {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border: 2px solid var(--vif); border-radius: 50%;
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #vise.actif { opacity: 1; transition: none; }

  .rangee { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
  button {
    background: var(--carte); color: var(--texte);
    border: 1px solid var(--trait); border-radius: 8px;
    padding: 9px 13px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--vif); }
  button:active { background: #21262d; }
  button.principal { background: #1f6feb; border-color: #1f6feb; }
  #pause.coupe { color: var(--ko); border-color: var(--ko); }
  .indice { font-size: 11px; color: var(--doux); text-align: center; max-width: 460px; line-height: 1.5; }
</style>
</head>
<body>

<h1>NetRemote</h1>
<div id="etat">Connexion…</div>

<div id="cadre">
  <img id="ecran" alt="écran du téléphone">
  <div id="vise"></div>
</div>

<div class="rangee">
  <button data-touche="back">◁ Retour</button>
  <button data-touche="home">◯ Accueil</button>
  <button data-touche="recents">▢ Récents</button>
</div>

<div class="rangee">
  <button data-touche="quicksettings" class="principal">Réglages rapides</button>
  <button data-touche="notifications">Notifications</button>
  <button id="reveil">Réveiller l'écran</button>
  <button id="pause">Pause</button>
</div>

<p class="indice">
  Clique sur l'écran pour appuyer au même endroit. Glisse pour faire défiler.
  Pour couper les données : <b>Réglages rapides</b>, puis la tuile de ton opérateur.
</p>

<script>
(function () {
  var ecran = document.getElementById('ecran');
  var cadre = document.getElementById('cadre');
  var vise  = document.getElementById('vise');
  var etat  = document.getElementById('etat');
  var pause = document.getElementById('pause');

  var largeur = 0, hauteur = 0;   // pixels reels du telephone
  var enPause = false;
  var occupe = false;
  var attente = 700;

  function dire(texte, erreur) {
    etat.textContent = texte;
    etat.className = erreur ? 'erreur' : '';
  }

  function appeler(chemin) {
    return fetch(chemin, { cache: 'no-store' }).then(function (r) { return r.json(); });
  }

  // --- Image ---------------------------------------------------------------

  function rafraichir() {
    if (enPause || occupe) return;
    occupe = true;
    var url = '/api/screen?w=540&t=' + Date.now();
    var img = new Image();
    img.onload = function () {
      ecran.src = img.src;
      occupe = false;
    };
    img.onerror = function () {
      occupe = false;
      appeler('/api/info').then(function (info) {
        dire(info.problem || 'capture indisponible', true);
      }).catch(function () {
        dire('téléphone injoignable', true);
      });
    };
    img.src = url;
  }

  // --- Viser ---------------------------------------------------------------

  // La position est convertie en pixels REELS du telephone : l'image est
  // reduite pour le reseau, et affichee a une taille encore differente par le
  // navigateur. Passer par des fractions evite d'avoir a connaitre l'une ou
  // l'autre.
  function versTelephone(evenement) {
    var boite = ecran.getBoundingClientRect();
    var fx = (evenement.clientX - boite.left) / boite.width;
    var fy = (evenement.clientY - boite.top) / boite.height;
    return {
      x: Math.round(Math.min(Math.max(fx, 0), 1) * largeur),
      y: Math.round(Math.min(Math.max(fy, 0), 1) * hauteur),
      ecranX: evenement.clientX - boite.left,
      ecranY: evenement.clientY - boite.top
    };
  }

  function marquer(point) {
    vise.style.left = point.ecranX + 'px';
    vise.style.top = point.ecranY + 'px';
    vise.classList.add('actif');
    setTimeout(function () { vise.classList.remove('actif'); }, 60);
  }

  var depart = null;

  ecran.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    depart = versTelephone(e);
    depart.temps = Date.now();
    marquer(depart);
  });

  ecran.addEventListener('pointerup', function (e) {
    if (!depart) return;
    var fin = versTelephone(e);
    var dx = fin.x - depart.x, dy = fin.y - depart.y;
    var distance = Math.sqrt(dx * dx + dy * dy);
    var duree = Date.now() - depart.temps;
    var d = depart;
    depart = null;

    // Un doigt ne tient jamais parfaitement immobile : en dessous de ce seuil,
    // c'est un appui, pas un glissement.
    if (distance < 18) {
      envoyer(duree > 550
        ? '/api/press?x=' + d.x + '&y=' + d.y
        : '/api/tap?x=' + d.x + '&y=' + d.y);
    } else {
      envoyer('/api/swipe?x1=' + d.x + '&y1=' + d.y +
              '&x2=' + fin.x + '&y2=' + fin.y +
              '&ms=' + Math.min(Math.max(duree, 120), 1200));
    }
  });

  ecran.addEventListener('pointercancel', function () { depart = null; });
  ecran.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function envoyer(chemin) {
    appeler(chemin).then(function (r) {
      dire(r.ok ? '' : r.detail, !r.ok);
      // Laisser l'ecran reagir avant de le relire.
      setTimeout(rafraichir, 350);
      setTimeout(rafraichir, 900);
    }).catch(function () {
      dire('téléphone injoignable', true);
    });
  }

  // --- Boutons -------------------------------------------------------------

  Array.prototype.forEach.call(document.querySelectorAll('[data-touche]'), function (b) {
    b.addEventListener('click', function () {
      envoyer('/api/key?name=' + b.getAttribute('data-touche'));
    });
  });

  document.getElementById('reveil').addEventListener('click', function () {
    dire('réveil…');
    appeler('/api/wake').then(function (r) {
      dire(r.detail);
      setTimeout(rafraichir, 600);
    });
  });

  pause.addEventListener('click', function () {
    enPause = !enPause;
    pause.textContent = enPause ? 'Reprendre' : 'Pause';
    pause.className = enPause ? 'coupe' : '';
    if (!enPause) rafraichir();
  });

  // --- Demarrage -----------------------------------------------------------

  appeler('/api/info').then(function (info) {
    largeur = info.width;
    hauteur = info.height;
    if (largeur && hauteur) {
      cadre.style.width = 'min(100%, 380px)';
      cadre.style.aspectRatio = largeur + ' / ' + hauteur;
    }
    dire(info.problem || (info.device + ' — Android ' + info.android + ' — ' + info.data),
         !!info.problem);
    rafraichir();
    setInterval(rafraichir, attente);
  }).catch(function () {
    dire('téléphone injoignable — NetRemote est-il lancé avec « Partager » ?', true);
  });
})();
</script>

</body>
</html>
